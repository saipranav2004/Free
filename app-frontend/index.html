<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="Privileged access management console" />
    <!--
      NOTHING IS FETCHED FROM GOOGLE ANY MORE. Two preconnects and a
      stylesheet link used to pull Inter and JetBrains Mono from
      fonts.googleapis.com on every single page load, which handed a third
      party the IP address of every operator who opened a privileged access
      console and put an external dependency in front of a product that gets
      installed into segmented and air-gapped networks. The faces are served
      from this origin now (see the @font-face block in src/index.css).

      These two are the faces a first paint actually needs: the variable sans
      and the regular mono, fetched alongside the stylesheet instead of after
      it. The accented and heavier cuts are pulled on demand by unicode-range.
    -->
    <link rel="preload" href="/fonts/plex-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>PAM Console</title>
  </head>
  <body class="bg-app text-ink-50 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
