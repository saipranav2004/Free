server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- compression -------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;


    # ---- corporate network allowlist ---------------------------------------
    # The reverse-proxy half of the control the API enforces in
    # internal/middleware/network_allowlist.go. Both are needed: the API stops
    # data being served, this stops the console being served at all, so a user
    # on an unapproved network gets a clean refusal instead of a page that
    # loads and then fails every request.
    #
    # Uncomment, replace the example ranges with the client's approved
    # networks, and reload. Two details that are easy to get wrong:
    #
    #   set_real_ip_from  MUST name the ranges of whatever sits in front of
    #                     this container (ALB, CloudFront, another nginx).
    #                     Without it $remote_addr is the load balancer and
    #                     either everyone is allowed or nobody is. With it,
    #                     X-Forwarded-For is believed ONLY from those hops,
    #                     which is what stops a client forging its own address.
    #   allow 127.0.0.1   keeps the container's own HEALTHCHECK working. Drop
    #                     it and Docker marks the container unhealthy and
    #                     restarts it in a loop.
    #
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;
    #
    # allow 127.0.0.1;              # container health check
    # allow 203.0.113.0/24;         # head office
    # allow 198.51.100.0/24;        # branch office
    # allow 2001:db8:acad::/48;     # head office IPv6
    # deny  all;                    # fail closed

    # ---- source maps are never served --------------------------------------
    # Defence in depth behind vite.config.js's `sourcemap: false`. A map file
    # carries the original, fully-commented source of every module, so a stale
    # one left in an image by an older build must not be fetchable. A regex
    # location takes precedence over the /assets/ prefix below, so this wins
    # wherever the file sits.
    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}
 