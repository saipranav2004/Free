server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ---- compression -------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;


    # ---- host validation ---------------------------------------------------
    # The edge half of the control the API enforces in
    # internal/middleware/trusted_host.go. This console is published on a
    # PRIVATE DNS name: the record exists only on the customer's internal
    # resolvers, and the network refuses anything that is not inside.
    #
    # What that leaves for this layer is refusing requests that DID arrive but
    # are not addressed to us by name, which is the part a firewall cannot
    # see. Replace the placeholder with the client's private name, and both
    # server blocks matter:
    #
    #   server_name   is the whole control. With "_" this container answers to
    #                 any name including the raw pod or instance IP, so anyone
    #                 who finds the address gets the console, and a
    #                 DNS-rebinding page can aim an internal browser at it.
    #   default_server below catches everything that does NOT match and closes
    #                 the connection without a response (444). No banner, no
    #                 redirect, nothing that confirms something is listening.
    #
    # The name below is the CONSOLE only. The brokered proxy's per-session
    # hosts (*.iam-opa.adapid.link) are served by pam-api, not by this
    # container, so they do not belong here: see
    # new_backnd/deploy/nginx/pam-webproxy.conf.
    # server_name iam-opa.adapid.link;

    # ---- the client address, for the API behind this ----------------------
    # set_real_ip_from MUST name the ranges of whatever sits in front of this
    # container (the internal load balancer, another nginx). Without it
    # $remote_addr is the load balancer, and every source address the API
    # records is that hop rather than the operator. With it, X-Forwarded-For
    # is believed ONLY from those hops, which is what stops a client naming
    # its own address in the audit trail.
    #
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;

    # real_ip_recursive on; 

    # ---- who may reach the console ----------------------------------------
    # These used to be hand-edited allow/deny lines, which meant every change
    # to "who can reach us" was a code change, a rebuild and a deploy — and,
    # because they shipped commented out, no restriction was ever actually in
    # force. They are now managed by the root operator in the console under
    # Settings > Organization, stored in the database, and rendered into the
    # file included below by docker-entrypoint.d/20-network-allowlist.sh.
    #
    # The include is optional on purpose. If the file has not been fetched —
    # first boot, or the API was unreachable at start — nginx must still
    # serve the console rather than refuse to start, because the API enforces
    # the same list itself and is the layer that actually protects data. This
    # copy is defence in depth for the static bundle, not the control.
    include /etc/nginx/allowlist/*.conf;

    # ---- source maps are never served --------------------------------------
    # Defence in depth behind vite.config.js's `sourcemap: false`. A map file
    # carries the original, fully-commented source of every module, so a stale
    # one left in an image by an older build must not be fetchable. A regex
    # location takes precedence over the /assets/ prefix below, so this wins
    # wherever the file sits.
    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}

# Everything not addressed to the name above. 444 closes the connection with
# no response at all: a request to the raw address gets nothing back, not even
# a refusal it could learn from.
#
# listen ... default_server is what makes this the fallback. Without a default
# server nginx uses the FIRST block as the fallback, which would hand the
# console to exactly the requests this is meant to drop.

